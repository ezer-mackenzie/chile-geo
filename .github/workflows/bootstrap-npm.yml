name: Bootstrap npm Package

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-v0.1.0 to continue
        required: true
        type: string

concurrency:
  group: npm-bootstrap
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    if: github.repository == 'ezer-mackenzie/chile-geo'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Verify explicit confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "${CONFIRMATION}" != "publish-v0.1.0" ]]; then
            echo "::error::Confirmation must be publish-v0.1.0."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: v0.1.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install current npm CLI
        run: npm install --global npm@^11.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Verify package artifacts
        run: bun run test:package

      - name: Verify bootstrap identity
        working-directory: packages/map-render
        shell: bash
        run: |
          package_name="$(bun -p "require('./package.json').name")"
          package_version="$(bun -p "require('./package.json').version")"
          if [[ "${package_name}@${package_version}" != "@chile-geo/maps@0.1.0" ]]; then
            echo "::error::Unexpected bootstrap package ${package_name}@${package_version}."
            exit 1
          fi

      - name: Verify npm token identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org/

      - name: Publish the first npm version
        working-directory: packages/map-render
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag latest
