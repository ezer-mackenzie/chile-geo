name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bun run check:bundle
      - run: bun run test:package
      - run: bun run examples:build
      - run: bun run test:browser:all
      - run: bun run docs:build

  three-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        three: ['0.180.0', '0.185.1']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.0' }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:package
        env:
          THREE_VERSION: ${{ matrix.three }}
