name: Publish Package

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'ezer-mackenzie/chile-geo'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install an OIDC-compatible npm CLI
        run: npm install --global npm@^11.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Verify package artifacts
        run: bun run test:package

      - name: Verify release contract
        run: bun run release:check

      - name: Select npm distribution tag
        id: dist-tag
        working-directory: packages/maps
        shell: bash
        run: |
          version="$(npm pkg get version | tr -d '"')"
          if [[ "${version}" == *-* ]]; then
            echo "value=next" >> "${GITHUB_OUTPUT}"
          else
            echo "value=latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to npm with trusted publishing
        working-directory: packages/maps
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.value }}"
