name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to publish, for example v0.2.0
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'ezer-mackenzie/chile-geo'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install an OIDC-compatible npm CLI
        run: npm install --global npm@^11.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Verify package artifacts
        run: bun run test:package

      - name: Locate the publishable package
        id: package
        shell: bash
        run: |
          if [[ -f packages/maps/package.json ]]; then
            echo "directory=packages/maps" >> "${GITHUB_OUTPUT}"
          elif [[ -f packages/map-render/package.json ]]; then
            echo "directory=packages/map-render" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::The @chile-geo/maps package directory was not found."
            exit 1
          fi

      - name: Verify release contract
        working-directory: ${{ steps.package.outputs.directory }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          package_name="$(bun -p "require('./package.json').name")"
          package_version="$(bun -p "require('./package.json').version")"

          if [[ "${package_name}" != "@chile-geo/maps" ]]; then
            echo "::error::Unexpected package name ${package_name}."
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package version ${package_version}."
            exit 1
          fi

          for manifest in ../../package.json ../../packages/data-geojson/package.json ../../packages/data-topojson/package.json; do
            manifest_version="$(bun -p "require('./${manifest}').version")"
            if [[ "${manifest_version}" != "${package_version}" ]]; then
              echo "::error::${manifest} is ${manifest_version}; expected ${package_version}."
              exit 1
            fi
          done

      - name: Set provenance repository metadata
        working-directory: ${{ steps.package.outputs.directory }}
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: >-
          bun -e "const path = 'package.json'; const manifest = await Bun.file(path).json();
          manifest.repository = { type: 'git', url: 'https://github.com/ezer-mackenzie/chile-geo', directory: process.env.PACKAGE_DIRECTORY };
          await Bun.write(path, JSON.stringify(manifest, null, 2) + '\n');"

      - name: Select npm distribution tag
        id: dist-tag
        working-directory: ${{ steps.package.outputs.directory }}
        shell: bash
        run: |
          version="$(bun -p "require('./package.json').version")"
          if [[ "${version}" == *-* ]]; then
            echo "value=next" >> "${GITHUB_OUTPUT}"
          else
            echo "value=latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to npm with trusted publishing
        working-directory: ${{ steps.package.outputs.directory }}
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.value }}"
