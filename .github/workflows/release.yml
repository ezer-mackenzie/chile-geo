name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository_owner != ''
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.0' }
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:package
      - name: Verify release tag and synchronized package versions
        run: bun run release:check
      - name: Report npm authentication mode
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Using the temporary npm bootstrap token."
          else
            echo "Using npm trusted publishing through GitHub OIDC."
          fi
      - name: Select npm distribution tag
        id: dist-tag
        working-directory: packages/map-render
        shell: bash
        run: |
          version="$(bun -p "require('./package.json').version")"
          if [[ "${version}" == *-* ]]; then
            echo "value=next" >> "${GITHUB_OUTPUT}"
          else
            echo "value=latest" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish package with provenance
        working-directory: packages/map-render
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag ${{ steps.dist-tag.outputs.value }}
